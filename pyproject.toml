[project]
name = "hexaverse"
version = "1.1.0"
description = "FSOC coarse-alignment simulator — AI-based virtual camera tracking system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=1.24",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
]
ai = [
    "onnxruntime>=1.15",
    "torch>=2.0",
]
full = [
    "PySide6>=6.5",
    "onnxruntime>=1.15",
    "torch>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
