name: clean
description: "Circular trajectory, no disturbances — ideal baseline"
simulation:
  fps: 30
  duration_s: 60
  random_seed: 42
camera:
  width: 1280
  height: 720
  h_fov_deg: 60.0
  v_fov_deg: 40.0
  pan_range: [-180.0, 180.0]
  tilt_range: [-30.0, 90.0]
  rate_limit_deg_s: 60.0
beacon:
  sigma_px: 4.0
  peak: 255.0
motion:
  type: circular
  center_az_deg: 5.0
  center_el_deg: 3.0
  radius_deg: 8.0
  speed_deg_s: 4.0
disturbances:
  vibration_rms_deg: 0.0
  noise_sigma: 0.0
  blur_pixels: 0.0
detector:
  threshold: 80
  min_area: 2
  max_area: 500
kalman:
  measurement_noise: 8.0
controller:
  kp: 1.0
  ki: 0.0
  kd: 0.15
  deadband_pixels: 3.0
tracker:
  acquire_threshold: 3
  lose_threshold: 5
  reacquire_timeout: 150
